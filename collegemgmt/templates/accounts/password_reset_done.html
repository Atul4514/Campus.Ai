{% extends 'base.html' %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
    <div class="auth-card-header">
        <i class="bi bi-envelope-check-fill"></i>
        <h3 class="mb-1">Check Your Email</h3>
    </div>
    <div class="auth-card-body text-center">
        <p>We've sent a password reset link to your email address, if an account exists.</p>
        <a href="{% url 'login_page' %}" class="btn btn-primary-custom text-white mt-2">Back to Login</a>
    </div>
</div>
{% endblock %}
