{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="dashboard-card p-4 mx-auto" style="max-width: 520px;">
    <div class="text-center mb-4">
        <i class="bi bi-person-circle" style="font-size: 3.5rem; color: #4f46e5;"></i>
        <h4 class="mt-2 mb-0">Welcome, {{ user.full_name|default:user.username }} 👋</h4>
        <span class="badge bg-primary text-uppercase mt-2">{{ user.role }}</span>
    </div>
    <ul class="list-group list-group-flush mb-3">
        <li class="list-group-item d-flex justify-content-between">
            <span><i class="bi bi-card-text me-2"></i>College ID</span>
            <strong>{{ user.college_id }}</strong>
        </li>
        <li class="list-group-item d-flex justify-content-between">
            <span><i class="bi bi-envelope me-2"></i>Email</span>
            <strong>{{ user.email }}</strong>
        </li>
        <li class="list-group-item d-flex justify-content-between">
            <span><i class="bi bi-building me-2"></i>Department</span>
            <strong>{{ user.department|default:"—" }}</strong>
        </li>
    </ul>
    <a href="{% url 'logout_page' %}" class="btn btn-outline-danger w-100 rounded-3">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
    </a>
</div>
{% endblock %}
