{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
    <div class="auth-card-header">
        <i class="bi bi-key-fill"></i>
        <h3 class="mb-1">Forgot Password?</h3>
        <p class="mb-0 opacity-75">Enter your email to reset it</p>
    </div>
    <div class="auth-card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-floating mb-3">
                {{ form.email }}
                <label for="{{ form.email.id_for_label }}">Email</label>
                {% if form.email.errors %}
                    <div class="field-error">{{ form.email.errors|striptags }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 text-white mt-2">
                <i class="bi bi-send me-1"></i> Send Reset Link
            </button>
        </form>
        <p class="text-center mt-4 mb-0 auth-link">
            <a href="{% url 'login_page' %}">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
