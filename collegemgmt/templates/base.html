<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CampusAI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4338ca;
            --accent: #06b6d4;
            --bg-grad-1: #6366f1;
            --bg-grad-2: #8b5cf6;
            --bg-grad-3: #4f46e5;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-solid: #ffffff;
            --text-main: #1e1b2e;
            --text-muted: #6b7280;
            --border-soft: rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg-grad-1: #0f0c29;
            --bg-grad-2: #302b63;
            --bg-grad-3: #24243e;
            --surface: rgba(30, 27, 46, 0.75);
            --surface-solid: #1a1730;
            --text-main: #f1f1f6;
            --text-muted: #a0a0b8;
            --border-soft: rgba(255,255,255,0.08);
        }
        * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            color: var(--text-main);
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar-custom {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            padding: 0.9rem 0;
        }
        .navbar-custom .navbar-brand {
            color: #fff;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
        .theme-toggle-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .theme-toggle-btn:hover { background: rgba(255,255,255,0.28); transform: rotate(20deg); }

        .auth-wrapper {
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card, .glass-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-card { width: 100%; max-width: 460px; }
        .auth-card-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 2rem 2rem 1.5rem;
            text-align: center;
        }
        .auth-card-header i { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .auth-card-body { padding: 2rem; }
        .form-floating > label { color: var(--text-muted); }
        .form-control {
            border-radius: 10px;
            border: 1.5px solid var(--border-soft);
            padding: 0.9rem 1rem;
            background: var(--surface-solid);
            color: var(--text-main);
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.15);
            background: var(--surface-solid);
            color: var(--text-main);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 10px;
            padding: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            color: #fff;
        }
        .auth-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .auth-link a:hover { text-decoration: underline; }
        .field-error { color: #f87171; font-size: 0.82rem; margin-top: 0.25rem; }

        .dash-wrapper { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        .stat-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 1.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeInUp 0.5s ease;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.2); }
        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            color: #fff;
        }
        .badge-role {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--text-muted);
            z-index: 5;
        }
        .password-field-wrap {
            position: relative;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand mb-0" href="/">
                <i class="bi bi-mortarboard-fill me-2"></i>CampusAI
            </a>
            <button class="theme-toggle-btn" id="themeToggle" title="Toggle dark mode">
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            </button>
        </div>
    </nav>

    <div class="{% block wrapper_class %}auth-wrapper{% endblock %}">
        <div class="w-100">
            {% if messages %}
                <div class="mx-auto mb-3" style="max-width: 460px;">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} rounded-3 shadow-sm">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const htmlEl = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        const savedTheme = localStorage.getItem('campusai-theme') || 'light';
        htmlEl.setAttribute('data-theme', savedTheme);
        themeIcon.className = savedTheme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';

        themeToggle.addEventListener('click', () => {
            const current = htmlEl.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('campusai-theme', next);
            themeIcon.className = next === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        });
    </script>
</body>
</html>
